<div class = "contenido-bienvenida">

  <h1>{{ titulo }}</h1>
  <h2>{{ universidad }}</h2>
  <p>{{ evento }}</p>

  <div class="equipos">

    @for (equipo of equipos; track equipo.nombre) {

      <div class="equipo">
        <h3>{{ equipo.nombre }}</h3>
        <p>{{ equipo.robot }}</p>
      </div>

    }

  </div>
</div>
